<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8mb-4">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автосалон - Система управления</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-brand">Автосалон</div>
            <div class="nav-links" id="navLinks">
                <a href="#" onclick="showSection('cars')" class="nav-link">Автомобили</a>
                <a href="#" onclick="showSection('clients')" class="nav-link">Клиенты</a>
                <a href="#" onclick="showSection('employees')" class="nav-link">Сотрудники</a>
                <a href="#" onclick="showSection('sales')" class="nav-link">Продажи</a>
                <a href="#" onclick="showSection('suppliers')" class="nav-link">Поставщики</a>
                <a href="#" onclick="showSection('supplies')" class="nav-link">Поставки</a>
                <div class="user-section">
                    <span id="userInfo">Загрузка...</span>
                    <button onclick="logout()" class="btn-logout">Выйти</button>
                </div>
            </div>
        </nav>

        <div id="mainContent">
            <div id="contentArea">
                <div class="welcome-container">
                    <h2>Добро пожаловать в систему управления автосалоном!</h2>
                    <p>Выберите раздел в меню выше для работы с данными.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="system.js"></script>
</body>
</html>
